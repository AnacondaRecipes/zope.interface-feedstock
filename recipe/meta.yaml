{% set name = "zope.interface" %}
{% set version = "8.2" %}

package:
  name: zope.interface
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/zope_interface-{{ version }}.tar.gz
  sha256: afb20c371a601d261b4f6edb53c3c418c249db1a9717b0baafc9a9bb39ba1224

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - zope
    - setuptools
    - wheel
  run:
    - python
    - setuptools
    - zope

test:
  imports:
    - zope
    - zope.interface
    - zope.interface.adapter
    - zope.interface.advice
    - zope.interface.common
    - zope.interface.common.idatetime
    - zope.interface.common.interfaces
    - zope.interface.common.mapping
    - zope.interface.common.sequence
    - zope.interface.declarations
    - zope.interface.document
    - zope.interface.exceptions
    - zope.interface.interface
    - zope.interface.interfaces
    - zope.interface.registry
    - zope.interface.ro
    - zope.interface.tests
    - zope.interface.tests.idummy
    - zope.interface.tests.m1
    - zope.interface.tests.test_declarations
    - zope.interface.tests.test_exceptions
    - zope.interface.tests.test_interface
    # No module named 'zope.testing'
    #- zope.interface.tests.test_ro
    - zope.interface.tests.test_sorting
    - zope.interface.verify
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/zopefoundation/zope.interface
  license: ZPL-2.1
  license_family: Other
  license_file: LICENSE.txt
  summary: Interfaces for Python
  description: |
    Provides an implementation of object interfaces for Python.Interfaces are objects
    that specify the external behavior of objects that provide them.
  doc_url: https://zopeinterface.readthedocs.io
  dev_url: https://github.com/zopefoundation/zope.interface

extra:
  recipe-maintainers:
    - isuruf
    - ocefpaf
  skip-lints:
    - python_build_tool_in_run
    - python_build_tools_in_host
    - host_section_needs_exact_pinnings
